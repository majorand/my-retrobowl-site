<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=games/retro-bowl/">
  <title>Retro Bowl</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080b10;
      color: #f4f7fb;
    }

    main {
      width: min(92vw, 520px);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 8vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 28px;
      color: #cbd5e1;
      font-size: 1rem;
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 2px solid #facc15;
      border-radius: 8px;
      background: #facc15;
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #38bdf8;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Retro Bowl</h1>
    <p>Opening the game now. If it does not start automatically, use the button below.</p>
    <a href="games/retro-bowl/">Open Retro Bowl</a>
  </main>

  <script>
    window.location.replace("games/retro-bowl/");
  </script>
</body>
</html>
